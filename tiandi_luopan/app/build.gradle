plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.yiijingcompass'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.yiijingcompass"
        minSdk 26
        targetSdk 34
        versionCode 133
        versionName "1.3.3"
    }

    // Release signing is opt-in.  The old file contained a hard-coded password
    // and referenced a keystore that is not part of the repository, which made
    // every clean build fail and exposed credentials in source control.
    def releaseKeystore = rootProject.file('yanxiang.jks')
    def releaseStorePassword = project.providers.gradleProperty('YANXIANG_STORE_PASSWORD')
        .orElse(project.providers.environmentVariable('YANXIANG_STORE_PASSWORD'))
    def releaseKeyAlias = project.providers.gradleProperty('YANXIANG_KEY_ALIAS')
        .orElse(project.providers.environmentVariable('YANXIANG_KEY_ALIAS'))
    def releaseKeyPassword = project.providers.gradleProperty('YANXIANG_KEY_PASSWORD')
        .orElse(project.providers.environmentVariable('YANXIANG_KEY_PASSWORD'))
    def hasReleaseSigning = releaseKeystore.isFile() &&
        releaseStorePassword.isPresent() && releaseKeyAlias.isPresent() && releaseKeyPassword.isPresent()

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile releaseKeystore
                storePassword releaseStorePassword.get()
                keyAlias releaseKeyAlias.get()
                keyPassword releaseKeyPassword.get()
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                outputFileName = "yanxiang-v${variant.versionName}.apk"
            } else {
                outputFileName = "yanxiang-v${variant.versionName}-${variant.buildType.name}.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
