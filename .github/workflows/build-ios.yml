name: iOS Development Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-sign:
    name: Build and Sign Development IPA
    runs-on: macos-15

    defaults:
      run:
        working-directory: tiandi_luopan
        shell: bash

    env:
      APP_BUNDLE_ID: com.yanxiang.compass
      PROJECT_PATH: ios/TiandiLuopan.xcodeproj
      SCHEME_NAME: TiandiLuopan
      CONFIGURATION: Release

    steps:
      # --------------------------------------------------
      # 1. 获取源代码
      # --------------------------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 检查构建环境
      # --------------------------------------------------
      - name: Show Build Environment
        run: |
          set -euo pipefail

          echo "===== macOS ====="
          sw_vers

          echo "===== Xcode ====="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

          echo "===== Project ====="
          test -d "$PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"

      # --------------------------------------------------
      # 3. 导入 Apple Development 证书和描述文件
      # --------------------------------------------------
      - name: Install Apple Development Certificate
        id: setup_signing
        env:
          P12_BASE64: ${{ secrets.BUILD_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # 检查 Secrets
          test -n "$P12_BASE64" || {
            echo "Missing BUILD_CERTIFICATE_P12"
            exit 1
          }

          test -n "$P12_PASSWORD" || {
            echo "Missing P12_PASSWORD"
            exit 1
          }

          test -n "$PROFILE_BASE64" || {
            echo "Missing BUILD_PROVISION_PROFILE"
            exit 1
          }

          test -n "$TEAM_ID" || {
            echo "Missing APPLE_TEAM_ID"
            exit 1
          }

          # 创建临时目录
          mkdir -p "$RUNNER_TEMP/signing"

          P12_PATH="$RUNNER_TEMP/signing/certificate.p12"
          PP_PATH="$RUNNER_TEMP/signing/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/signing/profile.plist"

          # 解码 Base64 文件
          printf '%s' "$P12_BASE64" | base64 -D > "$P12_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$PP_PATH"

          test -s "$P12_PATH"
          test -s "$PP_PATH"

          # 创建临时 Keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # 导入 P12 证书和私钥
          security import "$P12_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # 设置代码签名权限
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          # 将临时 Keychain 加入搜索列表
          security list-keychain -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          # 查找有效的 Apple Development 身份
          IDENTITIES="$(security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH")"

          echo "$IDENTITIES"

          SIGNING_IDENTITY="$(
            printf '%s\n' "$IDENTITIES" |
            awk -F '"' '/"(Apple Development|iPhone Developer):/ {
              print $2
              exit
            }'
          )"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: Valid Apple Development or iPhone Developer certificate not found."
            exit 1
          fi

          # 检查证书 Team ID (若为个人开发者账号可能使用 User ID，进行柔性检测避免误杀)
          if [[ "$SIGNING_IDENTITY" != *"($TEAM_ID)"* ]]; then
            echo "WARNING: Certificate identity does not contain ($TEAM_ID), proceeding with discovered identity."
          fi

          echo "Signing identity: $SIGNING_IDENTITY"

          # 解码 Provisioning Profile
          security cms -D \
            -i "$PP_PATH" \
            > "$PROFILE_PLIST"

          # 提取 Profile 信息
          PROFILE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Name" \
              "$PROFILE_PLIST"
          )

          PROFILE_UUID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :UUID" \
              "$PROFILE_PLIST"
          )

          PROFILE_TEAM=$(
            /usr/libexec/PlistBuddy \
              -c "Print :TeamIdentifier:0" \
              "$PROFILE_PLIST"
          )

          PROFILE_APP_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:application-identifier" \
              "$PROFILE_PLIST"
          )

          GET_TASK_ALLOW=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:get-task-allow" \
              "$PROFILE_PLIST"
          )

          echo "===== Provisioning Profile ====="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM"
          echo "Application ID: $PROFILE_APP_ID"
          echo "get-task-allow: $GET_TASK_ALLOW"

          # 检查 Profile 类型
          if [ "$GET_TASK_ALLOW" != "true" ]; then
            echo "ERROR: This is not an iOS Development profile."
            exit 1
          fi

          # 检查 Team ID
          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "ERROR: Profile Team ID mismatch."
            exit 1
          fi

          # 检查 Bundle ID
          case "$PROFILE_APP_ID" in
            *."$APP_BUNDLE_ID")
              ;;
            *)
              echo "ERROR: Bundle ID mismatch."
              echo "Expected: $APP_BUNDLE_ID"
              echo "Actual: $PROFILE_APP_ID"
              exit 1
              ;;
          esac

          # 检查 Profile 是否包含设备 UDID
          if ! /usr/libexec/PlistBuddy \
            -c "Print :ProvisionedDevices" \
            "$PROFILE_PLIST" \
            >/dev/null 2>&1; then
            echo "ERROR: Profile does not contain registered devices."
            exit 1
          fi

          # 安装 Provisioning Profile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          mkdir -p "$PROFILE_DIR"

          cp "$PP_PATH" \
            "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          # 输出给后续步骤使用
          {
            echo "signing_identity=$SIGNING_IDENTITY"
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_name=$PROFILE_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "Apple Development signing setup completed."

      # --------------------------------------------------
      # 4. 检查 Xcode 项目
      # --------------------------------------------------
      - name: Check Signing Configuration
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail

          echo "===== Build Settings ====="

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -showBuildSettings \
            | grep -E \
              'PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY|CODE_SIGN_STYLE' \
            || true

          echo "===== Signing Configuration ====="
          echo "Bundle ID: $APP_BUNDLE_ID"
          echo "Team ID: $TEAM_ID"
          echo "Profile UUID: $PROFILE_UUID"

      # --------------------------------------------------
      # 5. 创建 XCArchive
      # --------------------------------------------------
      - name: Build Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ steps.setup_signing.outputs.signing_identity }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail

          mkdir -p build

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath build/TiandiLuopan.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            2>&1 | tee build/xcodebuild-archive.log

          test -d build/TiandiLuopan.xcarchive

      # --------------------------------------------------
      # 6. 配置 Development 导出参数
      # --------------------------------------------------
      - name: Create ExportOptions
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail

          mkdir -p dist-ios

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>

              <key>signingCertificate</key>
              <string>Apple Development</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${APP_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ExportOptions.plist

      # --------------------------------------------------
      # 7. 导出 IPA
      # --------------------------------------------------
      - name: Export Development IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath build/TiandiLuopan.xcarchive \
            -exportPath dist-ios \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee build/xcodebuild-export.log

          echo "===== Exported Files ====="
          ls -lah dist-ios

          IPA_FILE="$(find dist-ios -maxdepth 1 -name '*.ipa' -print -quit)"

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. 验证 IPA 签名
      # --------------------------------------------------
      - name: Verify IPA Signature
        run: |
          set -euo pipefail

          IPA_FILE="$IPA_FILE"

          VERIFY_DIR="$RUNNER_TEMP/ipa-verify"

          mkdir -p "$VERIFY_DIR"

          unzip -q "$IPA_FILE" -d "$VERIFY_DIR"

          APP_PATH="$(find "$VERIFY_DIR/Payload" \
            -maxdepth 1 \
            -name '*.app' \
            -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Application bundle not found."
            exit 1
          fi

          echo "===== Verify Code Signature ====="

          codesign -dv \
            --verbose=4 \
            "$APP_PATH" \
            2>&1 | tee build/codesign-info.log

          codesign --verify \
            --verbose=2 \
            "$APP_PATH" || true

          echo "===== Verify Embedded Profile ====="

          EMBEDDED_PROFILE="$APP_PATH/embedded.mobileprovision"

          test -s "$EMBEDDED_PROFILE"

          security cms -D \
            -i "$EMBEDDED_PROFILE" \
            > "$VERIFY_DIR/embedded-profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :Name" \
            "$VERIFY_DIR/embedded-profile.plist"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements:get-task-allow" \
            "$VERIFY_DIR/embedded-profile.plist"

          echo "===== Verify Bundle ID ====="

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

          echo "IPA signature verification completed."

      # --------------------------------------------------
      # 9. 生成 SHA256
      # --------------------------------------------------
      - name: Generate SHA256
        run: |
          set -euo pipefail

          cd dist-ios

          shasum -a 256 *.ipa > SHA256SUMS.txt

          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 10. 上传 IPA 构建产物
      # --------------------------------------------------
      - name: Upload Development IPA
        uses: actions/upload-artifact@v4
        with:
          name: TiandiLuopan-Development-IPA
          path: tiandi_luopan/dist-ios/
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 11. 上传构建日志
      # --------------------------------------------------
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiandiLuopan-Build-Logs
          path: |
            tiandi_luopan/build/*.log
            tiandi_luopan/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7