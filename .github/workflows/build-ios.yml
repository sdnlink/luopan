name: iOS Multi-Mode Build & Deploy

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '构建目标模式 (Build Target)'
        required: true
        default: 'development'
        type: choice
        options:
          - 'development'
          - 'app-store'
      upload_to_appstore:
        description: '仅 app-store 模式生效：自动上传到 App Store Connect / TestFlight'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Sign (${{ github.event.inputs.build_target || 'development' }})
    # runner 标签写死在 YAML 里无法从本地验证真伪：标签不存在时 GitHub 不会报错，
    # 只会让 job 无限排队。这里留一个仓库变量覆盖口（Settings → Variables →
    # IOS_RUNNER_LABEL），标签一旦变更或不存在，改变量即可，不必改代码。
    runs-on: ${{ vars.IOS_RUNNER_LABEL || 'xcode-27' }}
    timeout-minutes: 60

    defaults:
      run:
        working-directory: tiandi_luopan
        shell: bash

    env:
      APP_BUNDLE_ID: com.yanxiang.compass
      WIDGET_BUNDLE_ID: com.yanxiang.compass.widget
      PROJECT_PATH: ios/TiandiLuopan.xcodeproj
      SCHEME_NAME: TiandiLuopan
      CONFIGURATION: Release
      BUILD_TARGET: ${{ github.event.inputs.build_target || 'development' }}

    steps:
      # --------------------------------------------------
      # 1. 获取源代码
      # --------------------------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 选择最新 Xcode 并检查构建环境
      # --------------------------------------------------
      - name: Select Xcode 27 & Require iOS 27.1 SDK
        run: |
          set -euo pipefail

          echo "===== Available Xcode Versions on Runner ====="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # 必须用 iOS 27.1 SDK 编译：低版本 SDK 构建的包在 iPhone Duo 内屏上
          # 会以兼容模式显示（缩小的 iPhone 画面 + 黑边），布局与商店包均不合格。
          XCODE_APP=""
          for cand in /Applications/Xcode_27.1.app /Applications/Xcode_27*.app; do
            if [ -d "$cand" ]; then XCODE_APP="$cand"; break; fi
          done
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on runner"
            exit 1
          fi
          echo "Switching to Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo missing)"
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-version 2>/dev/null || echo missing)"
          echo "Device SDK: $IOS_SDK | Simulator SDK: $SIM_SDK"
          for sdk in "$IOS_SDK" "$SIM_SDK"; do
            if ! awk -v v="$sdk" 'BEGIN { if (v !~ /^[0-9]+(\.[0-9]+)*$/) exit 1; split(v, a, "."); m = a[1] + 0; n = (a[2] == "" ? 0 : a[2] + 0); if (m < 27) exit 1; if (m == 27 && n < 1) exit 1; exit 0 }'; then
              echo "::error::iOS SDK 27.1+ required (got $sdk). Older SDK builds run in iPhone Duo compatibility mode."
              exit 1
            fi
          done
          echo "SDK check passed: iOS $IOS_SDK / Simulator $SIM_SDK"

          echo "===== Target Mode: $BUILD_TARGET ====="
          echo "===== macOS ====="
          sw_vers

          echo "===== Active Xcode & SDKs ====="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

          echo "===== Project ====="
          test -d "$PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"

      # --------------------------------------------------
      # 3. (已并入 Build Archive) build number 通过 CURRENT_PROJECT_VERSION 命令行参数传入，
      #    不再用 sed 改 pbxproj —— 原写法匹配不到时会被 || true 静默吞掉。
      # --------------------------------------------------
      # 4. 根据模式导入证书和描述文件
      # --------------------------------------------------
      - name: Install Signing Certificate & Profile
        id: setup_signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 开发者模式凭证 (含 fallback)
          DEV_P12: ${{ secrets.DEV_CERTIFICATE_P12 || secrets.BUILD_CERTIFICATE_P12 }}
          DEV_P12_PWD: ${{ secrets.DEV_P12_PASSWORD || secrets.P12_PASSWORD }}
          DEV_PROV: ${{ secrets.DEV_PROVISION_PROFILE || secrets.BUILD_PROVISION_PROFILE }}
          DEV_WIDGET_PROV: ${{ secrets.DEV_WIDGET_PROVISION_PROFILE || secrets.WIDGET_PROVISION_PROFILE }}
          # 发布者模式凭证 (含 fallback)
          DIST_P12: ${{ secrets.DIST_CERTIFICATE_P12 || secrets.BUILD_CERTIFICATE_P12 }}
          DIST_P12_PWD: ${{ secrets.DIST_P12_PASSWORD || secrets.P12_PASSWORD }}
          DIST_PROV: ${{ secrets.DIST_PROVISION_PROFILE || secrets.BUILD_PROVISION_PROFILE }}
          DIST_WIDGET_PROV: ${{ secrets.DIST_WIDGET_PROVISION_PROFILE || secrets.WIDGET_PROVISION_PROFILE }}
        run: |
          set -euo pipefail

          test -n "$TEAM_ID" || {
            echo "ERROR: Missing APPLE_TEAM_ID in GitHub Secrets."
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/signing"
          P12_PATH="$RUNNER_TEMP/signing/certificate.p12"
          PP_PATH="$RUNNER_TEMP/signing/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/signing/profile.plist"

          # 区分模式读取对应的 Base64
          if [ "$BUILD_TARGET" = "app-store" ]; then
            echo "==== Configuring for App Store / TestFlight (Distribution) ===="
            P12_RAW="$DIST_P12"
            P12_PASSWORD="$DIST_P12_PWD"
            PROV_RAW="$DIST_PROV"
            CERT_SEARCH_PATTERN="(Apple Distribution|iPhone Distribution)"
          else
            echo "==== Configuring for Developer Device Test (Development) ===="
            P12_RAW="$DEV_P12"
            P12_PASSWORD="$DEV_P12_PWD"
            PROV_RAW="$DEV_PROV"
            CERT_SEARCH_PATTERN="(Apple Development|iPhone Developer)"
          fi

          test -n "$P12_RAW" || {
            echo "ERROR: Missing certificate secret for $BUILD_TARGET mode."
            exit 1
          }
          test -n "$P12_PASSWORD" || {
            echo "ERROR: Missing certificate password secret for $BUILD_TARGET mode."
            exit 1
          }
          test -n "$PROV_RAW" || {
            echo "ERROR: Missing provisioning profile secret for $BUILD_TARGET mode."
            exit 1
          }

          printf '%s' "$P12_RAW" | base64 -D > "$P12_PATH"
          printf '%s' "$PROV_RAW" | base64 -D > "$PP_PATH"

          test -s "$P12_PATH"
          test -s "$PP_PATH"

          # 创建临时 Keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入 P12
          security import "$P12_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          # 查找匹配当前模式的有效身份
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "Available Identities in Keychain:"
          echo "$IDENTITIES"

          SIGNING_IDENTITY="$(
            printf '%s\n' "$IDENTITIES" |
            awk -F '"' "/$CERT_SEARCH_PATTERN:/ {
              print \$2
              exit
            }"
          )"

          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "ERROR: Matching signing certificate ($CERT_SEARCH_PATTERN) not found."
            exit 1
          fi

          if [[ "$SIGNING_IDENTITY" != *"($TEAM_ID)"* ]]; then
            echo "WARNING: Certificate identity does not contain ($TEAM_ID), proceeding with: $SIGNING_IDENTITY"
          fi

          echo "Selected Signing Identity: $SIGNING_IDENTITY"

          # 解码 Provisioning Profile
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$PROFILE_PLIST" 2>/dev/null || echo "false")

          echo "===== Provisioning Profile Metadata ====="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM"
          echo "App ID: $PROFILE_APP_ID"
          echo "get-task-allow: $GET_TASK_ALLOW"

          # 描述文件必须覆盖本 App 的 Bundle ID（右侧按通配符匹配，兼容通配描述文件）
          EXPECTED_APP_ID="$TEAM_ID.$APP_BUNDLE_ID"
          # shellcheck disable=SC2053
          if [[ "$EXPECTED_APP_ID" != $PROFILE_APP_ID ]]; then
            echo "ERROR: Profile App ID ($PROFILE_APP_ID) does not cover $EXPECTED_APP_ID"
            exit 1
          fi

          # 模式与描述文件校验
          if [ "$BUILD_TARGET" = "development" ]; then
            if [ "$GET_TASK_ALLOW" != "true" ]; then
              echo "ERROR: Development mode requires get-task-allow to be true."
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$PROFILE_PLIST" >/dev/null 2>&1; then
              echo "ERROR: Development profile must contain registered device UDIDs."
              exit 1
            fi
            METHOD="debugging"
            CERT_TYPE="Apple Development"
          else
            if [ "$GET_TASK_ALLOW" = "true" ]; then
              echo "ERROR: App Store mode requires get-task-allow to be false (Release distribution profile)."
              exit 1
            fi
            METHOD="app-store-connect"
            CERT_TYPE="Apple Distribution"
          fi

          # 校验 Team ID
          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "ERROR: Profile Team ID mismatch: expected $TEAM_ID, got $PROFILE_TEAM"
            exit 1
          fi

          # 安装主工程 Provisioning Profile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PP_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"

          # --------------------------------------------------
          # 小组件描述文件处理（兼容通配符 Wildcard / 独立描述文件 / 优雅降级）
          # --------------------------------------------------
          if [ "$BUILD_TARGET" = "app-store" ]; then
            WIDGET_PROV_RAW="$DIST_WIDGET_PROV"
          else
            WIDGET_PROV_RAW="$DEV_WIDGET_PROV"
          fi

          EXPECTED_WIDGET_APP_ID="$TEAM_ID.$WIDGET_BUNDLE_ID"
          HAS_WIDGET_PROFILE="false"
          WIDGET_PROFILE_UUID=""

          # shellcheck disable=SC2053
          if [[ "$EXPECTED_WIDGET_APP_ID" == $PROFILE_APP_ID ]]; then
            echo "Main profile is a wildcard that covers the widget ($PROFILE_APP_ID)."
            HAS_WIDGET_PROFILE="true"
            WIDGET_PROFILE_UUID="$PROFILE_UUID"
          elif [ -n "$WIDGET_PROV_RAW" ]; then
            echo "==== Configuring Widget Provisioning Profile ===="
            WIDGET_PP_PATH="$RUNNER_TEMP/signing/widget_profile.mobileprovision"
            WIDGET_PROFILE_PLIST="$RUNNER_TEMP/signing/widget_profile.plist"

            printf '%s' "$WIDGET_PROV_RAW" | base64 -D > "$WIDGET_PP_PATH"
            security cms -D -i "$WIDGET_PP_PATH" > "$WIDGET_PROFILE_PLIST"

            WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$WIDGET_PROFILE_PLIST")
            WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$WIDGET_PROFILE_PLIST")
            WIDGET_PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$WIDGET_PROFILE_PLIST")
            WIDGET_PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$WIDGET_PROFILE_PLIST")

            echo "===== Widget Provisioning Profile Metadata ====="
            echo "Name: $WIDGET_PROFILE_NAME"
            echo "UUID: $WIDGET_PROFILE_UUID"
            echo "Team: $WIDGET_PROFILE_TEAM"
            echo "App ID: $WIDGET_PROFILE_APP_ID"

            # shellcheck disable=SC2053
            if [[ "$EXPECTED_WIDGET_APP_ID" != $WIDGET_PROFILE_APP_ID ]]; then
              echo "ERROR: Widget Profile App ID ($WIDGET_PROFILE_APP_ID) does not cover $EXPECTED_WIDGET_APP_ID"
              exit 1
            fi

            if [ "$WIDGET_PROFILE_TEAM" != "$TEAM_ID" ]; then
              echo "ERROR: Widget Profile Team ID mismatch: expected $TEAM_ID, got $WIDGET_PROFILE_TEAM"
              exit 1
            fi

            cp "$WIDGET_PP_PATH" "$PROFILE_DIR/$WIDGET_PROFILE_UUID.mobileprovision"
            HAS_WIDGET_PROFILE="true"
            echo "Widget profile installed successfully: $WIDGET_PROFILE_NAME ($WIDGET_PROFILE_UUID)"
          else
            echo "::warning::No widget provisioning profile secret found for $BUILD_TARGET mode."
            echo "::warning::Expected App ID: $EXPECTED_WIDGET_APP_ID."
            echo "::warning::To sign the widget on CI, configure DEV_WIDGET_PROVISION_PROFILE / DIST_WIDGET_PROVISION_PROFILE in GitHub Secrets."
            HAS_WIDGET_PROFILE="false"
            WIDGET_PROFILE_UUID=""
          fi

          # 动态探测描述文件是否包含 App Groups 权限 (com.apple.security.application-groups)
          # 若主工程描述文件与小组件描述文件均已开启 App Group，则自动生成并注入 Entitlements，激活真机主程序与小组件实时坐向同步；
          # 若描述文件尚未勾选 App Group（如 Wildcard 通配描述文件），则保持空 Entitlements，确保归档签名不报错。
          MAIN_APP_GROUP=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups:0" "$PROFILE_PLIST" 2>/dev/null || true)
          WIDGET_APP_GROUP=""
          if [ "$HAS_WIDGET_PROFILE" = "true" ]; then
            if [ -f "${WIDGET_PROFILE_PLIST:-}" ]; then
              WIDGET_APP_GROUP=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups:0" "$WIDGET_PROFILE_PLIST" 2>/dev/null || true)
            else
              WIDGET_APP_GROUP="$MAIN_APP_GROUP"
            fi
          fi

          ENTITLEMENTS_PATH=""
          if [ -n "$MAIN_APP_GROUP" ] && { [ "$HAS_WIDGET_PROFILE" != "true" ] || [ -n "$WIDGET_APP_GROUP" ]; }; then
            ENTITLEMENTS_PATH="$RUNNER_TEMP/signing/AppGroup.entitlements"
            cat > "$ENTITLEMENTS_PATH" <<EOF
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>com.apple.security.application-groups</key>
	<array>
		<string>${MAIN_APP_GROUP}</string>
	</array>
</dict>
</plist>
EOF
            echo "Detected App Group entitlement ($MAIN_APP_GROUP) in provisioning profile; generated $ENTITLEMENTS_PATH"
          else
            echo "No App Group entitlement found in provisioning profile(s); archiving without CODE_SIGN_ENTITLEMENTS override."
          fi

          # 输出供后续步骤使用
          {
            echo "signing_identity=$SIGNING_IDENTITY"
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_name=$PROFILE_NAME"
            echo "has_widget_profile=$HAS_WIDGET_PROFILE"
            echo "widget_profile_uuid=$WIDGET_PROFILE_UUID"
            echo "entitlements_path=$ENTITLEMENTS_PATH"
            echo "export_method=$METHOD"
            echo "signing_cert_type=$CERT_TYPE"
          } >> "$GITHUB_OUTPUT"

          echo "Signing configuration completed successfully for target: $BUILD_TARGET"

      # --------------------------------------------------
      # 5. 创建 XCArchive 归档
      # --------------------------------------------------
      - name: Build Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ steps.setup_signing.outputs.signing_identity }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
          HAS_WIDGET_PROFILE: ${{ steps.setup_signing.outputs.has_widget_profile }}
          WIDGET_PROFILE_UUID: ${{ steps.setup_signing.outputs.widget_profile_uuid }}
          ENTITLEMENTS_PATH: ${{ steps.setup_signing.outputs.entitlements_path }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          if [ "$HAS_WIDGET_PROFILE" = "true" ]; then
            WIDGET_SIGN_ALLOWED="YES"
            WIDGET_SPECIFIER="$WIDGET_PROFILE_UUID"
            echo "Archiving with Widget Extension code signing enabled ($WIDGET_PROFILE_UUID)"
          else
            WIDGET_SIGN_ALLOWED="NO"
            WIDGET_SPECIFIER=""
            echo "Archiving with Widget Extension code signing disabled (no profile provided)"
          fi

          EXTRA_ENTITLEMENTS_ARG=()
          if [ -n "${ENTITLEMENTS_PATH:-}" ] && [ -f "$ENTITLEMENTS_PATH" ]; then
            EXTRA_ENTITLEMENTS_ARG+=("CODE_SIGN_ENTITLEMENTS=$ENTITLEMENTS_PATH")
            echo "Injecting CODE_SIGN_ENTITLEMENTS=$ENTITLEMENTS_PATH"
          fi

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath build/TiandiLuopan.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            APP_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            WIDGET_CODE_SIGNING_ALLOWED="$WIDGET_SIGN_ALLOWED" \
            WIDGET_PROVISIONING_PROFILE_SPECIFIER="$WIDGET_SPECIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ${EXTRA_ENTITLEMENTS_ARG[@]+"${EXTRA_ENTITLEMENTS_ARG[@]}"} \
            2>&1 | tee build/xcodebuild-archive.log

          test -d build/TiandiLuopan.xcarchive

          # 归档产物必须确实链接 iOS 27.1 SDK（DTSDKName 由构建时 SDK 写入）
          ARCHIVED_APP="build/TiandiLuopan.xcarchive/Products/Applications/TiandiLuopan.app"
          test -d "$ARCHIVED_APP" || { echo "::error::Archived app not found at $ARCHIVED_APP"; exit 1; }
          DTSDK="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$ARCHIVED_APP/Info.plist" 2>/dev/null || true)"
          echo "Archived DTSDKName = $DTSDK"
          case "$DTSDK" in
            *27.1*) : ;;
            *)
              echo "::error::Archive not built against iOS 27.1 SDK (DTSDKName=$DTSDK); Duo inner display would run in compatibility mode."
              exit 1
              ;;
          esac

          # 若未配置小组件描述文件，从归档中剥离未签名的 appex，避免后续 export 阶段校验失败
          if [ "$HAS_WIDGET_PROFILE" != "true" ]; then
            if [ -d "$ARCHIVED_APP/PlugIns/TiandiLuopanWidget.appex" ]; then
              echo "::warning::Removing unsigned TiandiLuopanWidget.appex from archive to allow main app IPA export."
              rm -rf "$ARCHIVED_APP/PlugIns/TiandiLuopanWidget.appex"
              rmdir "$ARCHIVED_APP/PlugIns" 2>/dev/null || true
            fi
          fi

          # build number 是否真的写进了产物（Info.plist 若写死了 CFBundleVersion 则不会生效）
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVED_APP/Info.plist" 2>/dev/null || true)"
          echo "Archived CFBundleVersion = $ACTUAL_BUILD (expected $BUILD_NUMBER)"
          if [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::warning::CFBundleVersion ($ACTUAL_BUILD) != run_number ($BUILD_NUMBER); TestFlight may reject a duplicate/lower build number."
          fi

      # --------------------------------------------------
      # 6. 配置导出选项 ExportOptions.plist
      # --------------------------------------------------
      - name: Create ExportOptions
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
          HAS_WIDGET_PROFILE: ${{ steps.setup_signing.outputs.has_widget_profile }}
          WIDGET_PROFILE_UUID: ${{ steps.setup_signing.outputs.widget_profile_uuid }}
          METHOD: ${{ steps.setup_signing.outputs.export_method }}
          SIGNING_CERT: ${{ steps.setup_signing.outputs.signing_cert_type }}
        run: |
          set -euo pipefail

          mkdir -p dist-ios

          if [ "$HAS_WIDGET_PROFILE" = "true" ]; then
            PROFILES_MAP="<key>${APP_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
                  <key>${WIDGET_BUNDLE_ID}</key>
                  <string>${WIDGET_PROFILE_UUID}</string>"
          else
            PROFILES_MAP="<key>${APP_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>"
          fi

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${METHOD}</string>

              <key>signingCertificate</key>
              <string>${SIGNING_CERT}</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  ${PROFILES_MAP}
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ExportOptions.plist

      # --------------------------------------------------
      # 7. 导出 IPA 安装包
      # --------------------------------------------------
      - name: Export IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath build/TiandiLuopan.xcarchive \
            -exportPath dist-ios \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee build/xcodebuild-export.log

          echo "===== Exported Files ====="
          ls -lah dist-ios

          IPA_FILE="$(find dist-ios -maxdepth 1 -name '*.ipa' -print -quit)"

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. 校验 IPA 签名信息
      # --------------------------------------------------
      - name: Verify IPA Signature
        run: |
          set -euo pipefail

          VERIFY_DIR="$RUNNER_TEMP/ipa-verify"
          mkdir -p "$VERIFY_DIR"

          unzip -q "$IPA_FILE" -d "$VERIFY_DIR"

          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Application bundle not found in IPA."
            exit 1
          fi

          echo "===== Code Signature Info ====="
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee build/codesign-info.log

          codesign --verify --verbose=2 "$APP_PATH"

          echo "===== Embedded Provisioning Profile ====="
          EMBEDDED_PROFILE="$APP_PATH/embedded.mobileprovision"
          test -s "$EMBEDDED_PROFILE"

          security cms -D -i "$EMBEDDED_PROFILE" > "$VERIFY_DIR/embedded-profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Name" "$VERIFY_DIR/embedded-profile.plist"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$VERIFY_DIR/embedded-profile.plist"

          # 检查小组件扩展签名（若存在）
          WIDGET_APPEX="$(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' 2>/dev/null | head -n 1 || true)"
          if [ -n "$WIDGET_APPEX" ] && [ -d "$WIDGET_APPEX" ]; then
            echo "===== Widget Extension Code Signature Info ====="
            codesign -dv --verbose=4 "$WIDGET_APPEX" 2>&1 | tee build/widget-codesign-info.log
            codesign --verify --verbose=2 "$WIDGET_APPEX"
            if [ -f "$WIDGET_APPEX/embedded.mobileprovision" ]; then
              security cms -D -i "$WIDGET_APPEX/embedded.mobileprovision" > "$VERIFY_DIR/widget-profile.plist"
              echo "Widget Profile Name: $(/usr/libexec/PlistBuddy -c "Print :Name" "$VERIFY_DIR/widget-profile.plist" 2>/dev/null || true)"
            fi
          fi

      # --------------------------------------------------
      # 9. 生成 SHA256 校验码
      # --------------------------------------------------
      - name: Generate SHA256 Checksums
        run: |
          set -euo pipefail
          cd dist-ios
          shasum -a 256 ./*.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 10. 上传至苹果商店 App Store Connect / TestFlight (仅 app-store 模式生效)
      # --------------------------------------------------
      - name: Upload to App Store Connect (TestFlight)
        # 注意：push 触发时 BUILD_TARGET 恒为 development，所以 push 永远不会上传；上传只在手动选 app-store 且勾选 upload_to_appstore 时发生。
        if: ${{ env.BUILD_TARGET == 'app-store' && inputs.upload_to_appstore }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_KEY_RAW: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          # 可选：App Store Connect 里该 App 的数字 Apple ID。Xcode 26 的 altool 在
          # Bundle ID 前缀相近的多个 App 间可能传错目标，设置后会显式指定。
          APP_APPLE_ID: ${{ secrets.APPSTORE_APPLE_ID }}
        run: |
          set -euo pipefail

          echo "===== Checking App Store Connect Upload Credentials ====="
          if [ -z "$API_KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY_RAW" ]; then
            echo "::error::Missing one of the required secrets: APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID, or APPSTORE_API_PRIVATE_KEY."
            echo "Please configure these in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # 确保私钥目录存在
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          trap 'rm -f "$KEY_FILE"' EXIT

          # 智能兼容：无论用户 Secret 存的是 PEM 原文还是 Base64，均能正确处理
          if echo "$API_KEY_RAW" | grep -q "BEGIN PRIVATE KEY"; then
            echo "$API_KEY_RAW" > "$KEY_FILE"
          else
            printf '%s' "$API_KEY_RAW" | base64 -D > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          # 重新确认 IPA 文件路径
          UPLOAD_IPA="$(find dist-ios -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$UPLOAD_IPA" ] || [ ! -f "$UPLOAD_IPA" ]; then
            echo "::error::Cannot find exported .ipa file in dist-ios/ directory!"
            exit 1
          fi

          echo "Target IPA for upload: $UPLOAD_IPA"
          echo "Uploading to App Store Connect using API Key: $API_KEY_ID..."

          APPLE_ID_ARGS=()
          if [ -n "${APP_APPLE_ID:-}" ]; then
            APPLE_ID_ARGS=(--apple-id "$APP_APPLE_ID")
          fi

          # --upload-app 已被 Apple 标记为 deprecated（官方建议 --upload-package），目前仍可用。
          UPLOAD_LOG="build/altool-upload.log"
          xcrun altool --upload-app \
            -f "$UPLOAD_IPA" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            ${APPLE_ID_ARGS[@]+"${APPLE_ID_ARGS[@]}"} \
            --verbose 2>&1 | tee "$UPLOAD_LOG"

          # 部分 Xcode 版本的 altool 上传失败时也返回 0，所以额外解析输出，避免“假成功”
          if grep -Eq 'UPLOAD FAILED|Validation failed|ERROR:' "$UPLOAD_LOG"; then
            echo "::error::altool reported an upload failure (see build/altool-upload.log)"
            exit 1
          fi

          echo "🎉 Successfully uploaded to App Store Connect! TestFlight build will appear in 5-15 minutes."

      # --------------------------------------------------
      # 11. 上传 IPA 构建产物至 GitHub Artifacts (两种模式均可下载)
      # --------------------------------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiandiLuopan-${{ github.event.inputs.build_target || 'development' }}-IPA
          path: tiandi_luopan/dist-ios/
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 12. 上传构建与诊断日志
      # --------------------------------------------------
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiandiLuopan-Build-Logs-${{ github.event.inputs.build_target || 'development' }}
          path: |
            tiandi_luopan/build/*.log
            tiandi_luopan/ExportOptions.plist
          if-no-files-found: ignore
          retention-days: 7
