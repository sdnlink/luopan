name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app || true

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project ios/TiandiLuopan.xcodeproj \
            -scheme TiandiLuopan \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TiandiLuopan.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/TiandiLuopan.xcarchive/Products/Applications/TiandiLuopan.app build/Payload/
          cd build
          zip -r YanXiangCompass-v1.3.0.ipa Payload
          cd ..
          mkdir -p dist-ios
          cp build/YanXiangCompass-v1.3.0.ipa dist-ios/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YanXiangCompass-iOS-IPA
          path: dist-ios/YanXiangCompass-v1.3.0.ipa
          retention-days: 14
