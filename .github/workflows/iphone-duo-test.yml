name: iPhone Duo Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: iphone-duo-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iphone-duo-smoke-test:
    name: iPhone Duo Simulator Smoke Test
    # GitHub 官方 Xcode 27 runner 镜像（macOS 27 + Xcode 27 工具链，含 iOS 27 SDK）。
    # iPhone Duo 模拟器随 Xcode 27.1 提供；若 runner 工具链不足，下方
    # "Locate iPhone Duo Simulator" 步骤会明确报错并列出全部可用设备类型。
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      # --------------------------------------------------
      # 1. 获取源代码
      # --------------------------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 检查工具链并确认 iPhone Duo 模拟器可用
      # --------------------------------------------------
      - name: Show Environment & Locate iPhone Duo Simulator
        run: |
          set -euo pipefail
          echo "===== Xcode ====="
          xcodebuild -version
          echo "===== iPhone Duo Device Types ====="
          xcrun simctl list devicetypes | grep -i duo || {
            echo "::error::iPhone Duo simulator is not available on this runner. Xcode 27.1 or later is required."
            echo "===== All Device Types ====="
            xcrun simctl list devicetypes
            exit 1
          }

      # --------------------------------------------------
      # 3. 创建并启动 iPhone Duo 模拟器（复用已存在的设备）
      # --------------------------------------------------
      - name: Create & Boot iPhone Duo Simulator
        run: |
          set -euo pipefail
          DUO_TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(t["identifier"] for t in d["devicetypes"] if "Duo" in t["name"]))')"
          echo "Device type: $DUO_TYPE_ID"

          UDID="$(xcrun simctl list devices -j | python3 -c 'import json,sys;d=json.load(sys.stdin);devs=[x for rt in d["devices"].values() for x in rt if "Duo" in x.get("name","")];print(devs[0]["udid"] if devs else "")')"
          if [ -z "$UDID" ]; then
            UDID="$(xcrun simctl create "iPhone Duo Test" "$DUO_TYPE_ID")"
            echo "Created simulator: $UDID"
          else
            echo "Using existing simulator: $UDID"
          fi
          echo "DUO_UDID=$UDID" >> "$GITHUB_ENV"

          # 模拟器默认处于折叠（外屏）状态。原生 simctl / XCUITest 无法切换
          # 折叠姿态；后续步骤用 duoctl（向模拟器注入私有 HID 事件）展开内屏
          # 并截图验证大屏布局。若 duoctl 在当前 runner 不可用，展开验证自动跳过。
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "===== Booted Simulators ====="
          xcrun simctl list devices | grep -i duo

      # --------------------------------------------------
      # 4. 针对 iPhone Duo 模拟器（iOS 27 runtime）构建 Debug 包
      # --------------------------------------------------
      - name: Build App for iPhone Duo (Debug)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project tiandi_luopan/ios/TiandiLuopan.xcodeproj \
            -scheme TiandiLuopan \
            -destination "platform=iOS Simulator,id=$DUO_UDID" \
            -configuration Debug \
            -derivedDataPath tiandi_luopan/build-duo \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee tiandi_luopan/build-duo-build.log

          APP_PATH="tiandi_luopan/build-duo/Build/Products/Debug-iphonesimulator/TiandiLuopan.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Built app not found at $APP_PATH"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "App built successfully at: $APP_PATH"

      # --------------------------------------------------
      # 5. 安装、授予权限并启动 App（外屏）
      # --------------------------------------------------
      - name: Install, Grant Permissions & Launch
        run: |
          set -euo pipefail
          BUNDLE_ID="com.yanxiang.compass"
          xcrun simctl install "$DUO_UDID" "$APP_PATH"
          for svc in location photos camera motion; do
            xcrun simctl privacy "$DUO_UDID" grant "$svc" "$BUNDLE_ID" 2>/dev/null \
              || echo "Skip privacy grant (unsupported service on this runtime): $svc"
          done
          xcrun simctl status_bar "$DUO_UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 2>/dev/null || true
          # 后台以 --console-pty 启动：App 崩溃时控制台会输出
          # Swift fatal error / uncaught exception 等精确原因
          (xcrun simctl launch --console-pty "$DUO_UDID" "$BUNDLE_ID" > app-console.log 2>&1 || true) &
          echo "Launched with console capture (background)"

      # --------------------------------------------------
      # 6. 冒烟测试：进程存活 + 默认语言主截图
      # --------------------------------------------------
      - name: Smoke Test (Process Alive + Main Screenshot)
        run: |
          set -euo pipefail
          BUNDLE_ID="com.yanxiang.compass"
          # 等待启动、传感器初始化与首屏渲染
          sleep 15
          echo "===== Process check ====="
          # 先完整落盘再 grep：pipefail 下 `launchctl list | grep -q` 会在匹配后
          # 立即让 launchctl 收到 SIGPIPE(signal 13)，管道返回非零，把“进程存活”
          # 误判为“进程不在”。落盘后 grep 文件可彻底消除该误判。
          xcrun simctl spawn "$DUO_UDID" launchctl list > launchctl.out 2>&1 || true
          if ! grep -q "$BUNDLE_ID" launchctl.out; then
            echo "::error::App process is not alive on iPhone Duo simulator"
            tail -30 launchctl.out || true
            echo "===== App console (crash reason) ====="
            cat app-console.log 2>/dev/null | tail -100 || true
            echo "===== Crash reports ====="
            CRASH_FILE="$(ls -t "$HOME/Library/Logs/DiagnosticReports"/TiandiLuopan* 2>/dev/null | head -1 || true)"
            if [ -n "$CRASH_FILE" ]; then
              echo "Found: $CRASH_FILE"
              grep -E "Exception Type|Termination Reason|Last Exception|abort|Fatal|SIG[A-Z]+|triggered" "$CRASH_FILE" | head -20 || true
              cp "$CRASH_FILE" crash-report.ips 2>/dev/null || true
            else
              ls -t "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -10 || true
            fi
            echo "===== System log (last 2m, app) ====="
            xcrun simctl spawn "$DUO_UDID" log show --last 2m --predicate 'process == "TiandiLuopan"' --style compact 2>/dev/null | tail -60 || true
            exit 1
          fi
          echo "App process is alive: $BUNDLE_ID"
          mkdir -p duo-screenshots
          # iPhone Duo 模拟器同时暴露两个显示器（LCD 外屏 / LCD-1 内屏），
          # simctl io screenshot 必须显式指定 --display：
          #   --display=1  LCD (primary)      1398x2034  外屏
          #   --display=3  LCD-1 (primary-1)  2007x2853  内屏
          xcrun simctl io "$DUO_UDID" screenshot --display=1 duo-screenshots/duo-tab-0-main.png

      # --------------------------------------------------
      # 7. 外屏截图：全部 8 种支持语言 × 全部 Tab（折叠态默认显示器）
      #    支持语言与 App 的 knownRegions / LocalizationManager 8 语种一致：
      #    zh-Hans, zh-Hant, en, ja, ko, vi, th, id
      # --------------------------------------------------
      - name: Capture All Tabs for All Languages (Outer Display)
        run: |
          set -euo pipefail
          BUNDLE_ID="com.yanxiang.compass"
          LANGS="zh-Hans zh-Hant en ja ko vi th id"
          LOCALES="zh_CN zh_TW en_US ja_JP ko_KR vi_VN th_TH id_ID"
          L=($LANGS); C=($LOCALES)
          for ((k=0; k<${#L[@]}; k++)); do
            lang="${L[$k]}"; locale="${C[$k]}"
            echo "===== Outer display, language: $lang ($locale) ====="
            mkdir -p "duo-screenshots/outer/$lang"
            for i in 0 1 2 3 4; do
              xcrun simctl terminate "$DUO_UDID" "$BUNDLE_ID" 2>/dev/null || true
              # 每次启动都显式注入语言与地区，确保 8 种语言截图互不影响
              xcrun simctl launch "$DUO_UDID" "$BUNDLE_ID" \
                -selectedTab "$i" -AppleLanguages "($lang)" -AppleLocale "$locale"
              sleep 8
              # 外屏（LCD，--display=1）：必需，失败即中断
              xcrun simctl io "$DUO_UDID" screenshot --display=1 "duo-screenshots/outer/$lang/duo-tab-$i.png"
            done
          done
          echo "===== Outer screenshots ====="
          find duo-screenshots/outer -type f | sort | wc -l
          ls -R duo-screenshots/outer

      # --------------------------------------------------
      # 8. 安装 duoctl：命令行展开/旋转 iPhone Duo 模拟器
      #    （skarol/duoctl，MIT；向模拟器注入 vendor HID 事件，
      #     README 明确支持 CI：brew install skarol/tap/duoctl）
      # --------------------------------------------------
      - name: Install duoctl (Fold Automation Tool)
        run: |
          set -euo pipefail
          if command -v duoctl >/dev/null 2>&1; then
            echo "duoctl already installed: $(duoctl --version 2>/dev/null || echo present)"
          else
            brew install skarol/tap/duoctl \
              || { echo "::warning::duoctl install failed; unfolded inner-display verification will be skipped"; }
          fi

      # --------------------------------------------------
      # 9. 展开 iPhone Duo 并截图内屏（验证 7.6" 大屏布局，全部 8 语言）
      #    模拟器默认折叠；duoctl open 展开到 180° 并回读状态校验，
      #    失败会报错而非静默成功。展开后按 8 语言 × 5 Tab 重启 App 截图，
      #    App 检测到 horizontalSizeClass==regular 自动启用大屏布局。
      # --------------------------------------------------
      - name: Unfold & Capture Inner Display for All Languages (duoctl)
        run: |
          set -euo pipefail
          BUNDLE_ID="com.yanxiang.compass"
          if ! command -v duoctl >/dev/null 2>&1; then
            echo "::warning::duoctl unavailable; skipping unfolded inner-display verification"
            exit 0
          fi
          export DUOCTL_UDID="$DUO_UDID"
          echo "===== State before unfold ====="
          duoctl state || true
          duoctl open || { echo "::warning::duoctl open failed on this runner; skipped"; exit 0; }
          echo "===== State after unfold ====="
          duoctl state
          # App 纯竖屏：内屏展开默认横屏界面，旋转回竖屏
          duoctl rotate portrait || echo "::warning::duoctl rotate failed; continuing with current orientation"
          LANGS="zh-Hans zh-Hant en ja ko vi th id"
          LOCALES="zh_CN zh_TW en_US ja_JP ko_KR vi_VN th_TH id_ID"
          L=($LANGS); C=($LOCALES)
          for ((k=0; k<${#L[@]}; k++)); do
            lang="${L[$k]}"; locale="${C[$k]}"
            echo "===== Inner display (unfolded), language: $lang ($locale) ====="
            mkdir -p "duo-screenshots/inner/$lang"
            for i in 0 1 2 3 4; do
              xcrun simctl terminate "$DUO_UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl launch "$DUO_UDID" "$BUNDLE_ID" \
                -selectedTab "$i" -AppleLanguages "($lang)" -AppleLocale "$locale"
              sleep 8
              duoctl screenshot "duo-screenshots/inner/$lang/duo-inner-unfolded-tab-$i.png" \
                || echo "::warning::unfolded inner screenshot failed for tab $i (lang $lang)"
            done
          done
          echo "===== Unfolded inner screenshots ====="
          find duo-screenshots/inner -type f | sort | wc -l
          ls -R duo-screenshots/inner

      # --------------------------------------------------
      # 10. 上传截图与构建日志
      # --------------------------------------------------
      - name: Upload iPhone Duo Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Duo-Screenshots
          path: duo-screenshots/
          retention-days: 14
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Duo-Build-Logs
          path: tiandi_luopan/build-duo-build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Crash Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Duo-Crash-Diagnostics
          path: |
            app-console.log
            crash-report.ips
          retention-days: 7
          if-no-files-found: ignore

      # --------------------------------------------------
      # 11. 结果摘要与已知限制说明
      # --------------------------------------------------
      - name: Summary
        if: always()
        run: |
          echo "=========================================================================="
          echo "🧪 iPhone Duo 模拟器冒烟测试完成"
          echo " - 覆盖：iOS 27 runtime 构建、安装、权限、启动、进程存活"
          echo " - 语言：8 种支持语言全量（zh-Hans / zh-Hant / en / ja / ko / vi / th / id）"
          echo " - 外屏（折叠态）：8 语言 × 5 Tab 截图  LCD (--display=1, 1398x2034)"
          echo " - 内屏（展开态）：duoctl open 展开 180° 后 8 语言 × 5 Tab 截图（大屏布局）"
          echo ""
          echo "⚠️ 说明："
          echo "   1. 原生 simctl / XCUITest 无法控制折叠姿态；展开由 duoctl"
          echo "      （skarol/duoctl，私有 HID 事件注入）完成，依赖 Xcode 27.1+。"
          echo "   2. 若 duoctl 安装或 open 失败，本步骤自动跳过并告警，"
          echo "      不影响外屏验证；展开态大屏布局需在 Device Hub 或真机复核。"
          echo "   3. 截图按 duo-screenshots/{outer,inner}/<语言>/ 组织，"
          echo "      语言通过 -AppleLanguages/-AppleLocale 启动参数逐次注入。"
          echo "=========================================================================="
