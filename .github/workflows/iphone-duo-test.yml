name: iPhone Duo Two-Pane Screenshots

on:
  workflow_dispatch:

concurrency:
  group: iphone-duo-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 两个并行 Job：
#  Job 1 (regular-layout-ipad)：iPad 13" 模拟器 —— 保证跑。
#    App 的双栏布局判定是 horizontalSizeClass == .regular（与设备 idiom 无关，
#    与 FoldableTwoPane/ProportionalTwoPaneLayout 同口径），iPad 全形态必然
#    命中同一套展开态双栏代码路径，因此这是确定性的双屏布局截图验证。
#  Job 2 (iphone-duo-best-effort)：iPhone Duo 模拟器 —— 尽力跑。
#    需要 runner 的 Xcode 提供 "iPhone Duo" 设备类型；展开姿态依赖 duoctl
#    （skarol/duoctl，向模拟器注入私有 HID 事件）。任一环节不可用则优雅跳过，
#    由 Job 1 兜底验证布局。

jobs:
  # ================================================================
  # Job 1: regular 宽度双栏布局截图（iPad，确定性通过）
  # ================================================================
  regular-layout-ipad:
    name: Two-Pane Layout Screenshots (iPad = regular size class)
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Select Highest Available Xcode
        run: |
          HIGHEST_XCODE="$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)"
          if [ -n "$HIGHEST_XCODE" ]; then
            echo "Selecting Xcode at: $HIGHEST_XCODE"
            sudo xcode-select -s "$HIGHEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Set up Python & Pillow
        run: |
          python3 -m pip install --break-system-packages Pillow || python3 -m pip install Pillow

      - name: Build App for iOS Simulator (Debug)
        run: |
          xcodebuild build \
            -project tiandi_luopan/ios/TiandiLuopan.xcodeproj \
            -scheme TiandiLuopan \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            -derivedDataPath tiandi_luopan/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH="tiandi_luopan/build/Build/Products/Debug-iphonesimulator/TiandiLuopan.app"
          [ -d "$APP_PATH" ] || { echo "::error::Built app not found at $APP_PATH"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      # 复用既有 iPad 截图脚本：8 语言 × 5 Tab（-selectedTab 启动参数由
      # RootContentView.init 支持），iPad 上即 regular 双栏布局。
      - name: Capture Two-Pane Screenshots (8 langs x 5 tabs)
        run: |
          python3 .github/scripts/capture_ipad_screenshots.py \
            --app-path "$APP_PATH" \
            --lang all \
            --output-dir "two-pane-screenshots/ipad"

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Two-Pane-iPad-Screenshots
          path: two-pane-screenshots/
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🖥️ 展开态双栏布局截图（iPad = regular size class）"
            echo ""
            echo "- 覆盖 8 语言 × 5 Tab；iPad 全形态 \`horizontalSizeClass == .regular\`，"
            echo "  与 iPhone Duo 展开态走 **同一套** FoldableTwoPane / ProportionalTwoPaneLayout 代码路径。"
            echo "- 检查要点：罗盘盘面/九宫排盘/户型画布位于左栏（约 58%~62% 宽），"
            echo "  分金卡/格局评析/体检报告位于右栏，右栏可独立滚动。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ================================================================
  # Job 2: iPhone Duo 真机模拟器截图（折叠外屏必跑，展开内屏尽力）
  # ================================================================
  iphone-duo-best-effort:
    name: iPhone Duo Simulator (folded outer + unfolded inner if possible)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Select Highest Available Xcode
        run: |
          HIGHEST_XCODE="$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)"
          if [ -n "$HIGHEST_XCODE" ]; then
            echo "Selecting Xcode at: $HIGHEST_XCODE"
            sudo xcode-select -s "$HIGHEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      # 检测（非致命）：Duo 设备类型缺失时跳过本 Job 后续步骤，
      # 布局验证由 Job 1 的 regular size class 路径兜底。
      - name: Detect iPhone Duo Device Type
        id: detect_duo
        run: |
          echo "===== Device Types matching 'Duo' ====="
          xcrun simctl list devicetypes | grep -i duo || true
          if xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);exit(0 if any("Duo" in t["name"] for t in d["devicetypes"]) else 1)'; then
            echo "duo_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::iPhone Duo simulator device type is not available on this runner (Xcode $(xcodebuild -version | head -1)). Two-pane layout is still verified by the iPad job (same .regular code path)."
            echo "duo_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create & Boot iPhone Duo Simulator
        if: steps.detect_duo.outputs.duo_available == 'true'
        run: |
          set -euo pipefail
          DUO_TYPE_ID="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=json.load(sys.stdin);print(next(t["identifier"] for t in d["devicetypes"] if "Duo" in t["name"]))')"
          echo "Device type: $DUO_TYPE_ID"

          UDID="$(xcrun simctl list devices -j | python3 -c 'import json,sys;d=json.load(sys.stdin);devs=[x for rt in d["devices"].values() for x in rt if "Duo" in x.get("name","")];print(devs[0]["udid"] if devs else "")')"
          if [ -z "$UDID" ]; then
            UDID="$(xcrun simctl create "iPhone Duo Test" "$DUO_TYPE_ID")"
            echo "Created simulator: $UDID"
          else
            echo "Using existing simulator: $UDID"
          fi
          echo "DUO_UDID=$UDID" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          echo "===== Booted ====="
          xcrun simctl list devices | grep -i duo || true

      - name: Build App for iPhone Duo (Debug)
        if: steps.detect_duo.outputs.duo_available == 'true'
        run: |
          set -euo pipefail
          xcodebuild build \
            -project tiandi_luopan/ios/TiandiLuopan.xcodeproj \
            -scheme TiandiLuopan \
            -destination "platform=iOS Simulator,id=$DUO_UDID" \
            -configuration Debug \
            -derivedDataPath tiandi_luopan/build-duo \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_PATH="tiandi_luopan/build-duo/Build/Products/Debug-iphonesimulator/TiandiLuopan.app"
          [ -d "$APP_PATH" ] || { echo "::error::Built app not found at $APP_PATH"; exit 1; }
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Install, Grant Permissions, Set GPS & Launch
        if: steps.detect_duo.outputs.duo_available == 'true'
        run: |
          set -euo pipefail
          BUNDLE_ID="com.yanxiang.compass"
          xcrun simctl install "$DUO_UDID" "$APP_PATH"
          for svc in location location-always photos motion microphone camera; do
            xcrun simctl privacy "$DUO_UDID" grant "$svc" "$BUNDLE_ID" 2>/dev/null \
              || echo "Skip privacy grant (unsupported service on this runtime): $svc"
          done
          # 北京坐标：让罗盘/节气在截图前即时算出（与 iPad 脚本口径一致）
          xcrun simctl location "$DUO_UDID" set "39.9042,116.4074" 2>/dev/null || true
          xcrun simctl status_bar "$DUO_UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 2>/dev/null || true
          xcrun simctl launch "$DUO_UDID" "$BUNDLE_ID"
          sleep 15

          # 冒烟：进程必须存活
          xcrun simctl spawn "$DUO_UDID" launchctl list > launchctl.out 2>&1 || true
          grep -q "$BUNDLE_ID" launchctl.out \
            || { echo "::error::App process is not alive on iPhone Duo simulator"; tail -30 launchctl.out; exit 1; }
          echo "App process is alive: $BUNDLE_ID"

      # 外屏（折叠态）截图：8 语言 × 5 Tab。
      # 模拟器若暴露多显示器，外屏为 primary（--display=1）；单显示器则回退默认截图。
      - name: Capture Folded Outer Display (8 langs x 5 tabs)
        if: steps.detect_duo.outputs.duo_available == 'true'
        run: |
          set -euo pipefail
          BUNDLE_ID="com.yanxiang.compass"
          LANGS="zh-Hans zh-Hant en ja ko vi th id"
          LOCALES="zh_CN zh_TW en_US ja_JP ko_KR vi_VN th_TH id_ID"
          L=($LANGS); C=($LOCALES)
          for ((k=0; k<${#L[@]}; k++)); do
            lang="${L[$k]}"; locale="${C[$k]}"
            mkdir -p "duo-screenshots/outer/$lang"
            for i in 0 1 2 3 4; do
              xcrun simctl terminate "$DUO_UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl launch "$DUO_UDID" "$BUNDLE_ID" \
                -selectedTab "$i" -AppleLanguages "($lang)" -AppleLocale "$locale"
              sleep 8
              xcrun simctl io "$DUO_UDID" screenshot --display=1 "duo-screenshots/outer/$lang/duo-tab-$i.png" 2>/dev/null \
                || xcrun simctl io "$DUO_UDID" screenshot "duo-screenshots/outer/$lang/duo-tab-$i.png"
            done
          done
          find duo-screenshots/outer -type f | sort | wc -l

      # 展开内屏截图：完全依赖 duoctl（skarol/duoctl，私有 HID 事件注入）。
      # 安装/open 任一失败 → 跳过并告警，布局验证由 Job 1（iPad regular）兜底。
      - name: Unfold & Capture Inner Display (duoctl, best-effort)
        if: steps.detect_duo.outputs.duo_available == 'true'
        run: |
          set -euo pipefail
          BUNDLE_ID="com.yanxiang.compass"
          if ! command -v duoctl >/dev/null 2>&1; then
            brew install skarol/tap/duoctl || true
          fi
          if ! command -v duoctl >/dev/null 2>&1; then
            echo "::warning::duoctl unavailable on this runner; unfolded inner-display capture skipped. Two-pane layout is still verified by the iPad job."
            exit 0
          fi
          export DUOCTL_UDID="$DUO_UDID"
          duoctl open || { echo "::warning::duoctl open failed; unfolded capture skipped"; exit 0; }
          duoctl rotate portrait || echo "::warning::duoctl rotate failed; continuing"

          LANGS="zh-Hans zh-Hant en ja ko vi th id"
          LOCALES="zh_CN zh_TW en_US ja_JP ko_KR vi_VN th_TH id_ID"
          L=($LANGS); C=($LOCALES)
          for ((k=0; k<${#L[@]}; k++)); do
            lang="${L[$k]}"; locale="${C[$k]}"
            mkdir -p "duo-screenshots/inner/$lang"
            for i in 0 1 2 3 4; do
              xcrun simctl terminate "$DUO_UDID" "$BUNDLE_ID" 2>/dev/null || true
              xcrun simctl launch "$DUO_UDID" "$BUNDLE_ID" \
                -selectedTab "$i" -AppleLanguages "($lang)" -AppleLocale "$locale"
              sleep 8
              duoctl screenshot "duo-screenshots/inner/$lang/duo-inner-tab-$i.png" \
                || echo "::warning::unfolded inner screenshot failed for tab $i (lang $lang)"
            done
          done
          find duo-screenshots/inner -type f | sort | wc -l

      - name: Upload iPhone Duo Screenshots
        if: steps.detect_duo.outputs.duo_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Duo-Screenshots
          path: duo-screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          {
            echo "## 📱 iPhone Duo 模拟器截图（best-effort）"
            echo ""
            echo "- 设备类型可用性：\`${{ steps.detect_duo.outputs.duo_available }}\`"
            echo "- 折叠外屏：8 语言 × 5 Tab（\`-selectedTab\` 由 RootContentView 启动参数支持）"
            echo "- 展开内屏：依赖 duoctl；不可用时跳过（布局已由 iPad Job 以同一 \`.regular\` 代码路径验证）"
          } >> "$GITHUB_STEP_SUMMARY"
