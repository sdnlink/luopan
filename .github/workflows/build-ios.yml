name: iOS Multi-Mode Build & Deploy

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '构建目标模式 (Build Target)'
        required: true
        default: 'development'
        type: choice
        options:
          - 'development'
          - 'app-store'
      upload_to_appstore:
        description: '仅 app-store 模式生效：自动上传到 App Store Connect / TestFlight'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - master
    # 只有工程或 workflow 本身变化才触发，避免改文档也占一次 macOS runner
    paths:
      - 'tiandi_luopan/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  # 把构建目标放进 group：避免 push 触发的 development 构建把排队中的 app-store 构建顶掉
  group: ios-build-${{ github.ref }}-${{ github.event.inputs.build_target || 'development' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Sign (${{ github.event.inputs.build_target || 'development' }})
    # runner 标签写死在 YAML 里无法从本地验证真伪：标签不存在时 GitHub 不会报错，
    # 只会让 job 无限排队。这里留一个仓库变量覆盖口（Settings → Variables →
    # IOS_RUNNER_LABEL），标签一旦变更或不存在，改变量即可，不必改代码。
    runs-on: ${{ vars.IOS_RUNNER_LABEL || 'xcode-27' }}
    timeout-minutes: 60

    defaults:
      run:
        working-directory: tiandi_luopan
        shell: bash

    env:
      APP_BUNDLE_ID: com.yanxiang.compass
      WIDGET_BUNDLE_ID: com.yanxiang.compass.widget
      PROJECT_PATH: ios/TiandiLuopan.xcodeproj
      SCHEME_NAME: TiandiLuopan
      CONFIGURATION: Release
      BUILD_TARGET: ${{ github.event.inputs.build_target || 'development' }}

    steps:
      # --------------------------------------------------
      # 1. 获取源代码
      # --------------------------------------------------
      - name: Checkout Source
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 选择 Xcode 并检查构建环境
      # --------------------------------------------------
      - name: Select Xcode 27 & Require iOS 27.1 SDK
        run: |
          set -euo pipefail

          echo "===== Available Xcode Versions on Runner ====="
          ls -d /Applications/Xcode*.app 2>/dev/null || true

          # 必须用 iOS 27.1+ SDK 编译：低版本 SDK 构建的包在 iPhone Duo 内屏上
          # 会以兼容模式显示（缩小的 iPhone 画面 + 黑边），布局与商店包均不合格。
          # 用版本排序取最高的 Xcode_27*，避免 27.0 排在 27.1.1 前面被先选中。
          XCODE_APP="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode installation found on runner"
            exit 1
          fi

          # 用 DEVELOPER_DIR 而不是 sudo xcode-select -s：不改机器全局状态，也不需要免密 sudo
          export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          echo "Using Xcode: $XCODE_APP"
          xcodebuild -version

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || echo missing)"
          echo "Device SDK: $IOS_SDK"
          if ! awk -v v="$IOS_SDK" 'BEGIN { if (v !~ /^[0-9]+(\.[0-9]+)*$/) exit 1; split(v, a, "."); m = a[1] + 0; n = (a[2] == "" ? 0 : a[2] + 0); if (m < 27) exit 1; if (m == 27 && n < 1) exit 1; exit 0 }'; then
            echo "::error::iOS SDK 27.1+ required (got $IOS_SDK). Older SDK builds run in iPhone Duo compatibility mode."
            exit 1
          fi
          echo "SDK check passed: iOS $IOS_SDK"

          echo "===== Target Mode: $BUILD_TARGET ====="
          sw_vers
          xcodebuild -showsdks

          echo "===== Project ====="
          test -d "$PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"

      # --------------------------------------------------
      # 3. 生成 build number 并做工程前置检查
      #    build number 用 UTC 时间戳（YYMMDD.HHMM），单调递增：
      #    - Re-run 不会和上次已上传的 build 撞号（run_number 在 Re-run 时不变）
      #    - 不依赖 TestFlight 上已有的历史 build 号大小
      #    它通过 CURRENT_PROJECT_VERSION 命令行参数传入 xcodebuild，不再 sed 改 pbxproj。
      # --------------------------------------------------
      - name: Prepare Build Number & Project Checks
        run: |
          set -euo pipefail

          NOW="$(date -u +%y%m%d%H%M)"
          BUILD_NUMBER="${NOW:0:6}.$((10#${NOW:6:4}))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER"

          # 依赖管理提示：本 workflow 直接 xcodebuild -project，不会安装依赖
          if [ -f pubspec.yaml ]; then
            echo "::warning::Detected pubspec.yaml (Flutter). This workflow does not run 'flutter pub get'; generated xcconfig may be missing."
          fi
          if [ -f ios/Podfile ]; then
            echo "::warning::Detected ios/Podfile (CocoaPods). This workflow builds with -project and does not run 'pod install'; you probably need -workspace."
          fi

          # 自定义签名变量必须在工程里被引用，否则会被静默忽略
          for var in APP_PROVISIONING_PROFILE_SPECIFIER WIDGET_PROVISIONING_PROFILE_SPECIFIER WIDGET_CODE_SIGNING_ALLOWED; do
            if ! grep -rqs --include=project.pbxproj --include='*.xcconfig' "$var" ios; then
              echo "::warning::$var is not referenced in project.pbxproj / *.xcconfig; the command-line override will have no effect."
            fi
          done

      # --------------------------------------------------
      # 4. 根据模式导入证书和描述文件
      # --------------------------------------------------
      - name: Install Signing Certificate & Profile
        id: setup_signing
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 可选：App Group ID（仓库变量）。设置后强制使用它；不设置则从描述文件里自动挑
          APP_GROUP_ID: ${{ vars.APP_GROUP_ID }}
          # 开发者模式凭证 (含 fallback)
          DEV_P12: ${{ secrets.DEV_CERTIFICATE_P12 || secrets.BUILD_CERTIFICATE_P12 }}
          DEV_P12_PWD: ${{ secrets.DEV_P12_PASSWORD || secrets.P12_PASSWORD }}
          DEV_PROV: ${{ secrets.DEV_PROVISION_PROFILE || secrets.BUILD_PROVISION_PROFILE }}
          DEV_WIDGET_PROV: ${{ secrets.DEV_WIDGET_PROVISION_PROFILE || secrets.WIDGET_PROVISION_PROFILE }}
          # 发布者模式凭证 (含 fallback)
          DIST_P12: ${{ secrets.DIST_CERTIFICATE_P12 || secrets.BUILD_CERTIFICATE_P12 }}
          DIST_P12_PWD: ${{ secrets.DIST_P12_PASSWORD || secrets.P12_PASSWORD }}
          DIST_PROV: ${{ secrets.DIST_PROVISION_PROFILE || secrets.BUILD_PROVISION_PROFILE }}
          DIST_WIDGET_PROV: ${{ secrets.DIST_WIDGET_PROVISION_PROFILE || secrets.WIDGET_PROVISION_PROFILE }}
        run: |
          set -euo pipefail

          test -n "$TEAM_ID" || {
            echo "ERROR: Missing APPLE_TEAM_ID in GitHub Secrets."
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/signing"
          P12_PATH="$RUNNER_TEMP/signing/certificate.p12"
          PP_PATH="$RUNNER_TEMP/signing/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/signing/profile.plist"
          INSTALLED_LIST="$RUNNER_TEMP/signing/installed_profiles.txt"
          : > "$INSTALLED_LIST"

          # 区分模式读取对应的 Base64
          if [ "$BUILD_TARGET" = "app-store" ]; then
            echo "==== Configuring for App Store / TestFlight (Distribution) ===="
            P12_RAW="$DIST_P12"
            P12_PASSWORD="$DIST_P12_PWD"
            PROV_RAW="$DIST_PROV"
            WIDGET_PROV_RAW="$DIST_WIDGET_PROV"
            CERT_SEARCH_PATTERN="(Apple Distribution|iPhone Distribution)"
          else
            echo "==== Configuring for Developer Device Test (Development) ===="
            P12_RAW="$DEV_P12"
            P12_PASSWORD="$DEV_P12_PWD"
            PROV_RAW="$DEV_PROV"
            WIDGET_PROV_RAW="$DEV_WIDGET_PROV"
            CERT_SEARCH_PATTERN="(Apple Development|iPhone Developer)"
          fi

          test -n "$P12_RAW" || {
            echo "ERROR: Missing certificate secret for $BUILD_TARGET mode."
            exit 1
          }
          test -n "$P12_PASSWORD" || {
            echo "ERROR: Missing certificate password secret for $BUILD_TARGET mode."
            exit 1
          }
          test -n "$PROV_RAW" || {
            echo "ERROR: Missing provisioning profile secret for $BUILD_TARGET mode."
            exit 1
          }

          printf '%s' "$P12_RAW" | base64 -D > "$P12_PATH"
          printf '%s' "$PROV_RAW" | base64 -D > "$PP_PATH"

          test -s "$P12_PATH"
          test -s "$PP_PATH"

          # 创建临时 Keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入 P12：只授权 codesign / security，不用 -A（-A 允许任意程序访问私钥）
          security import "$P12_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s \
            "$KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"

          # 查找匹配当前模式的有效身份
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "Available Identities in Keychain:"
          echo "$IDENTITIES"

          SIGNING_LINE="$(printf '%s\n' "$IDENTITIES" | grep -E "\"$CERT_SEARCH_PATTERN:" | head -n 1 || true)"
          if [ -z "$SIGNING_LINE" ]; then
            echo "ERROR: Matching signing certificate ($CERT_SEARCH_PATTERN) not found."
            exit 1
          fi
          SIGNING_IDENTITY="$(printf '%s\n' "$SIGNING_LINE" | sed -E 's/^[^"]*"([^"]*)".*/\1/')"
          CERT_SHA1="$(printf '%s\n' "$SIGNING_LINE" | awk '{print toupper($2)}')"

          if [[ "$SIGNING_IDENTITY" != *"($TEAM_ID)"* ]]; then
            echo "WARNING: Certificate identity does not contain ($TEAM_ID), proceeding with: $SIGNING_IDENTITY"
          fi
          echo "Selected Signing Identity: $SIGNING_IDENTITY ($CERT_SHA1)"

          # 描述文件通用预检：未过期 + 包含刚导入的这张证书
          check_profile() {
            local plist="$1" label="$2" exp exp_epoch i=0 found="false" sha
            exp="$(plutil -extract ExpirationDate raw -o - "$plist")"
            exp_epoch="$(date -u -j -f '%Y-%m-%dT%H:%M:%SZ' "$exp" +%s)"
            if [ "$exp_epoch" -le "$(date -u +%s)" ]; then
              echo "ERROR: $label provisioning profile expired at $exp"
              exit 1
            fi
            while sha="$(plutil -extract "DeveloperCertificates.$i" raw -o - "$plist" 2>/dev/null)"; do
              sha="$(printf '%s' "$sha" | base64 -D | shasum -a 1 | awk '{print toupper($1)}')"
              if [ "$sha" = "$CERT_SHA1" ]; then found="true"; fi
              i=$((i + 1))
            done
            if [ "$found" != "true" ]; then
              echo "ERROR: $label provisioning profile does not contain the imported certificate ($CERT_SHA1)."
              exit 1
            fi
            echo "$label profile preflight OK (expires $exp)"
          }

          # 读取某个描述文件里的全部 App Group
          groups_of() {
            /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" "$1" 2>/dev/null \
              | grep -E '^[[:space:]]+[^[:space:]]' | sed -E 's/^[[:space:]]+//' || true
          }

          # 解码 Provisioning Profile
          security cms -D -i "$PP_PATH" > "$PROFILE_PLIST"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PROFILE_PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST")
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$PROFILE_PLIST" 2>/dev/null || echo "false")

          echo "===== Provisioning Profile Metadata ====="
          echo "Name: $PROFILE_NAME"
          echo "UUID: $PROFILE_UUID"
          echo "Team: $PROFILE_TEAM"
          echo "App ID: $PROFILE_APP_ID"
          echo "get-task-allow: $GET_TASK_ALLOW"

          # 描述文件必须覆盖本 App 的 Bundle ID（右侧按通配符匹配，兼容通配描述文件）
          EXPECTED_APP_ID="$TEAM_ID.$APP_BUNDLE_ID"
          # shellcheck disable=SC2053
          if [[ "$EXPECTED_APP_ID" != $PROFILE_APP_ID ]]; then
            echo "ERROR: Profile App ID ($PROFILE_APP_ID) does not cover $EXPECTED_APP_ID"
            exit 1
          fi

          # 模式与描述文件校验
          if [ "$BUILD_TARGET" = "development" ]; then
            if [ "$GET_TASK_ALLOW" != "true" ]; then
              echo "ERROR: Development mode requires get-task-allow to be true."
              exit 1
            fi
            if ! /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$PROFILE_PLIST" >/dev/null 2>&1; then
              echo "ERROR: Development profile must contain registered device UDIDs."
              exit 1
            fi
            METHOD="debugging"
            CERT_TYPE="Apple Development"
          else
            if [ "$GET_TASK_ALLOW" = "true" ]; then
              echo "ERROR: App Store mode requires get-task-allow to be false (Release distribution profile)."
              exit 1
            fi
            METHOD="app-store-connect"
            CERT_TYPE="Apple Distribution"
          fi

          # 校验 Team ID
          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "ERROR: Profile Team ID mismatch: expected $TEAM_ID, got $PROFILE_TEAM"
            exit 1
          fi

          check_profile "$PROFILE_PLIST" "Main app"

          # 安装主工程 Provisioning Profile
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$PP_PATH" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "$PROFILE_DIR/$PROFILE_UUID.mobileprovision" >> "$INSTALLED_LIST"

          # --------------------------------------------------
          # 小组件描述文件处理（兼容通配符 Wildcard / 独立描述文件）
          # --------------------------------------------------
          EXPECTED_WIDGET_APP_ID="$TEAM_ID.$WIDGET_BUNDLE_ID"
          HAS_WIDGET_PROFILE="false"
          WIDGET_PROFILE_UUID=""
          WIDGET_PROFILE_PLIST=""

          # shellcheck disable=SC2053
          if [[ "$EXPECTED_WIDGET_APP_ID" == $PROFILE_APP_ID ]]; then
            echo "Main profile is a wildcard that covers the widget ($PROFILE_APP_ID)."
            HAS_WIDGET_PROFILE="true"
            WIDGET_PROFILE_UUID="$PROFILE_UUID"
          elif [ -n "$WIDGET_PROV_RAW" ]; then
            echo "==== Configuring Widget Provisioning Profile ===="
            WIDGET_PP_PATH="$RUNNER_TEMP/signing/widget_profile.mobileprovision"
            WIDGET_PROFILE_PLIST="$RUNNER_TEMP/signing/widget_profile.plist"

            printf '%s' "$WIDGET_PROV_RAW" | base64 -D > "$WIDGET_PP_PATH"
            security cms -D -i "$WIDGET_PP_PATH" > "$WIDGET_PROFILE_PLIST"

            WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$WIDGET_PROFILE_PLIST")
            WIDGET_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$WIDGET_PROFILE_PLIST")
            WIDGET_PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$WIDGET_PROFILE_PLIST")
            WIDGET_PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$WIDGET_PROFILE_PLIST")
            WIDGET_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$WIDGET_PROFILE_PLIST" 2>/dev/null || echo "false")

            echo "===== Widget Provisioning Profile Metadata ====="
            echo "Name: $WIDGET_PROFILE_NAME"
            echo "UUID: $WIDGET_PROFILE_UUID"
            echo "Team: $WIDGET_PROFILE_TEAM"
            echo "App ID: $WIDGET_PROFILE_APP_ID"

            # shellcheck disable=SC2053
            if [[ "$EXPECTED_WIDGET_APP_ID" != $WIDGET_PROFILE_APP_ID ]]; then
              echo "ERROR: Widget Profile App ID ($WIDGET_PROFILE_APP_ID) does not cover $EXPECTED_WIDGET_APP_ID"
              exit 1
            fi

            if [ "$WIDGET_PROFILE_TEAM" != "$TEAM_ID" ]; then
              echo "ERROR: Widget Profile Team ID mismatch: expected $TEAM_ID, got $WIDGET_PROFILE_TEAM"
              exit 1
            fi

            if [ "$BUILD_TARGET" = "app-store" ] && [ "$WIDGET_GET_TASK_ALLOW" = "true" ]; then
              echo "ERROR: App Store mode requires the widget profile to be a distribution profile (get-task-allow=false)."
              exit 1
            fi

            check_profile "$WIDGET_PROFILE_PLIST" "Widget"

            cp "$WIDGET_PP_PATH" "$PROFILE_DIR/$WIDGET_PROFILE_UUID.mobileprovision"
            echo "$PROFILE_DIR/$WIDGET_PROFILE_UUID.mobileprovision" >> "$INSTALLED_LIST"
            HAS_WIDGET_PROFILE="true"
            echo "Widget profile installed successfully: $WIDGET_PROFILE_NAME ($WIDGET_PROFILE_UUID)"
          else
            if [ "$BUILD_TARGET" = "app-store" ]; then
              echo "::error::No widget provisioning profile for app-store mode (expected App ID: $EXPECTED_WIDGET_APP_ID). Refusing to ship a build without the widget."
              echo "::error::Configure DIST_WIDGET_PROVISION_PROFILE in GitHub Secrets, or use a wildcard distribution profile."
              exit 1
            fi
            echo "::warning::No widget provisioning profile secret found for $BUILD_TARGET mode."
            echo "::warning::Expected App ID: $EXPECTED_WIDGET_APP_ID. The widget will be signed off and stripped from this development build."
          fi

          # --------------------------------------------------
          # App Group：仅当主 App 和小组件的描述文件都带有同一个 App Group 时才注入 entitlements。
          # 注意：CODE_SIGN_ENTITLEMENTS 命令行覆盖会作用于所有 target，并替换工程里原有的
          # entitlements 文件（Push、关联域名等会被丢掉）。如果工程还依赖这些能力，
          # 请改为在工程里配置 entitlements，并把此处的注入去掉。
          # --------------------------------------------------
          MAIN_GROUPS="$(groups_of "$PROFILE_PLIST")"
          if [ "$HAS_WIDGET_PROFILE" = "true" ] && [ -n "$WIDGET_PROFILE_PLIST" ]; then
            WIDGET_GROUPS="$(groups_of "$WIDGET_PROFILE_PLIST")"
          else
            WIDGET_GROUPS="$MAIN_GROUPS"
          fi

          SELECTED_GROUP=""
          if [ -n "${APP_GROUP_ID:-}" ]; then
            if printf '%s\n' "$MAIN_GROUPS" | grep -qxF "$APP_GROUP_ID" && printf '%s\n' "$WIDGET_GROUPS" | grep -qxF "$APP_GROUP_ID"; then
              SELECTED_GROUP="$APP_GROUP_ID"
            else
              echo "ERROR: APP_GROUP_ID ($APP_GROUP_ID) is not present in both the app and widget provisioning profiles."
              echo "Main groups: $MAIN_GROUPS"
              echo "Widget groups: $WIDGET_GROUPS"
              exit 1
            fi
          else
            # 取两个描述文件共有的第一个 group
            while IFS= read -r g; do
              [ -n "$g" ] || continue
              if printf '%s\n' "$WIDGET_GROUPS" | grep -qxF "$g"; then SELECTED_GROUP="$g"; break; fi
            done <<< "$MAIN_GROUPS"
          fi

          ENTITLEMENTS_PATH=""
          if [ -n "$SELECTED_GROUP" ]; then
            ENTITLEMENTS_PATH="$RUNNER_TEMP/signing/AppGroup.entitlements"
            cat > "$ENTITLEMENTS_PATH" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>${SELECTED_GROUP}</string>
              </array>
          </dict>
          </plist>
          EOF
            plutil -lint "$ENTITLEMENTS_PATH"
            echo "Using App Group '$SELECTED_GROUP'; generated $ENTITLEMENTS_PATH"
            echo "::warning::CODE_SIGN_ENTITLEMENTS override applies to ALL targets and replaces the project's own entitlements files."
          else
            echo "No common App Group in provisioning profile(s); archiving without CODE_SIGN_ENTITLEMENTS override."
          fi

          # 输出供后续步骤使用
          {
            echo "signing_identity=$SIGNING_IDENTITY"
            echo "profile_uuid=$PROFILE_UUID"
            echo "profile_name=$PROFILE_NAME"
            echo "has_widget_profile=$HAS_WIDGET_PROFILE"
            echo "widget_profile_uuid=$WIDGET_PROFILE_UUID"
            echo "entitlements_path=$ENTITLEMENTS_PATH"
            echo "export_method=$METHOD"
            echo "signing_cert_type=$CERT_TYPE"
          } >> "$GITHUB_OUTPUT"

          echo "Signing configuration completed successfully for target: $BUILD_TARGET"

      # --------------------------------------------------
      # 5. 创建 XCArchive 归档
      # --------------------------------------------------
      - name: Build Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ steps.setup_signing.outputs.signing_identity }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
          HAS_WIDGET_PROFILE: ${{ steps.setup_signing.outputs.has_widget_profile }}
          WIDGET_PROFILE_UUID: ${{ steps.setup_signing.outputs.widget_profile_uuid }}
          ENTITLEMENTS_PATH: ${{ steps.setup_signing.outputs.entitlements_path }}
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          if [ "$HAS_WIDGET_PROFILE" = "true" ]; then
            WIDGET_SIGN_ALLOWED="YES"
            WIDGET_SPECIFIER="$WIDGET_PROFILE_UUID"
            echo "Archiving with Widget Extension code signing enabled ($WIDGET_PROFILE_UUID)"
          else
            WIDGET_SIGN_ALLOWED="NO"
            WIDGET_SPECIFIER=""
            echo "Archiving with Widget Extension code signing disabled (no profile provided)"
          fi

          EXTRA_ENTITLEMENTS_ARG=()
          if [ -n "${ENTITLEMENTS_PATH:-}" ] && [ -f "$ENTITLEMENTS_PATH" ]; then
            EXTRA_ENTITLEMENTS_ARG+=("CODE_SIGN_ENTITLEMENTS=$ENTITLEMENTS_PATH")
            echo "Injecting CODE_SIGN_ENTITLEMENTS=$ENTITLEMENTS_PATH"
          fi

          xcodebuild archive \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME_NAME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -archivePath build/TiandiLuopan.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            APP_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            WIDGET_CODE_SIGNING_ALLOWED="$WIDGET_SIGN_ALLOWED" \
            WIDGET_PROVISIONING_PROFILE_SPECIFIER="$WIDGET_SPECIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ${EXTRA_ENTITLEMENTS_ARG[@]+"${EXTRA_ENTITLEMENTS_ARG[@]}"} \
            2>&1 | tee build/xcodebuild-archive.log

          test -d build/TiandiLuopan.xcarchive

          ARCHIVED_APP="build/TiandiLuopan.xcarchive/Products/Applications/TiandiLuopan.app"
          test -d "$ARCHIVED_APP" || { echo "::error::Archived app not found at $ARCHIVED_APP"; exit 1; }

          # 归档产物必须确实链接 iOS 27.1+ SDK（DTSDKName 由构建时 SDK 写入，形如 iphoneos27.1）
          DTSDK="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$ARCHIVED_APP/Info.plist" 2>/dev/null || true)"
          echo "Archived DTSDKName = $DTSDK"
          DTSDK_VER="${DTSDK#iphoneos}"
          if ! awk -v v="$DTSDK_VER" 'BEGIN { if (v !~ /^[0-9]+(\.[0-9]+)*$/) exit 1; split(v, a, "."); m = a[1] + 0; n = (a[2] == "" ? 0 : a[2] + 0); if (m < 27) exit 1; if (m == 27 && n < 1) exit 1; exit 0 }'; then
            echo "::error::Archive not built against iOS 27.1+ SDK (DTSDKName=$DTSDK); Duo inner display would run in compatibility mode."
            exit 1
          fi

          # 开发模式且未配置小组件描述文件：剥离未签名的 appex，避免 export 阶段校验失败
          # （app-store 模式在签名步骤已经强制要求小组件描述文件，不会走到这里）
          if [ "$HAS_WIDGET_PROFILE" != "true" ]; then
            if [ -d "$ARCHIVED_APP/PlugIns/TiandiLuopanWidget.appex" ]; then
              echo "::warning::Removing unsigned TiandiLuopanWidget.appex from archive to allow main app IPA export."
              rm -rf "$ARCHIVED_APP/PlugIns/TiandiLuopanWidget.appex"
              rmdir "$ARCHIVED_APP/PlugIns" 2>/dev/null || true
            fi
          fi

          # build number 是否真的写进了产物（Info.plist 若写死了 CFBundleVersion 则不会生效）
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$ARCHIVED_APP/Info.plist" 2>/dev/null || true)"
          echo "Archived CFBundleVersion = $ACTUAL_BUILD (expected $BUILD_NUMBER)"
          if [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            if [ "$BUILD_TARGET" = "app-store" ]; then
              echo "::error::CFBundleVersion ($ACTUAL_BUILD) != $BUILD_NUMBER. Info.plist probably hardcodes CFBundleVersion; it must be \$(CURRENT_PROJECT_VERSION)."
              exit 1
            fi
            echo "::warning::CFBundleVersion ($ACTUAL_BUILD) != $BUILD_NUMBER."
          fi

      # --------------------------------------------------
      # 6. 配置导出选项 ExportOptions.plist
      #    manageAppVersionAndBuildNumber=false：不让 Xcode 在导出/上传时改写 build number，
      #    保证 IPA 里的版本号就是我们生成的 BUILD_NUMBER。
      # --------------------------------------------------
      - name: Create ExportOptions
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.setup_signing.outputs.profile_uuid }}
          HAS_WIDGET_PROFILE: ${{ steps.setup_signing.outputs.has_widget_profile }}
          WIDGET_PROFILE_UUID: ${{ steps.setup_signing.outputs.widget_profile_uuid }}
          METHOD: ${{ steps.setup_signing.outputs.export_method }}
          SIGNING_CERT: ${{ steps.setup_signing.outputs.signing_cert_type }}
        run: |
          set -euo pipefail

          mkdir -p dist-ios

          if [ "$HAS_WIDGET_PROFILE" = "true" ]; then
            PROFILES_MAP="<key>${APP_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
                  <key>${WIDGET_BUNDLE_ID}</key>
                  <string>${WIDGET_PROFILE_UUID}</string>"
          else
            PROFILES_MAP="<key>${APP_BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>"
          fi

          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${METHOD}</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>signingCertificate</key>
              <string>${SIGNING_CERT}</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  ${PROFILES_MAP}
              </dict>

              <key>destination</key>
              <string>export</string>

              <key>manageAppVersionAndBuildNumber</key>
              <false/>

              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint ExportOptions.plist

          # 上传用的变体：与上面完全相同，只把 destination 换成 upload
          sed 's#<string>export</string>#<string>upload</string>#' ExportOptions.plist > ExportOptions-upload.plist
          plutil -lint ExportOptions-upload.plist

      # --------------------------------------------------
      # 7. 导出 IPA 安装包
      # --------------------------------------------------
      - name: Export IPA
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath build/TiandiLuopan.xcarchive \
            -exportPath dist-ios \
            -exportOptionsPlist ExportOptions.plist \
            2>&1 | tee build/xcodebuild-export.log

          echo "===== Exported Files ====="
          ls -lah dist-ios

          IPA_FILE="$(find dist-ios -maxdepth 1 -name '*.ipa' -print -quit)"

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA file was not generated."
            exit 1
          fi

          echo "IPA_FILE=$IPA_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. 校验 IPA 签名信息（带断言）
      # --------------------------------------------------
      - name: Verify IPA Signature
        env:
          HAS_WIDGET_PROFILE: ${{ steps.setup_signing.outputs.has_widget_profile }}
        run: |
          set -euo pipefail

          VERIFY_DIR="$RUNNER_TEMP/ipa-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          unzip -q "$IPA_FILE" -d "$VERIFY_DIR"

          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Application bundle not found in IPA."
            exit 1
          fi

          echo "===== Code Signature Info ====="
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee build/codesign-info.log

          codesign --verify --verbose=2 "$APP_PATH"

          echo "===== Embedded Provisioning Profile ====="
          EMBEDDED_PROFILE="$APP_PATH/embedded.mobileprovision"
          test -s "$EMBEDDED_PROFILE"

          security cms -D -i "$EMBEDDED_PROFILE" > "$VERIFY_DIR/embedded-profile.plist"
          echo "Profile: $(/usr/libexec/PlistBuddy -c "Print :Name" "$VERIFY_DIR/embedded-profile.plist")"
          GTA="$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$VERIFY_DIR/embedded-profile.plist" 2>/dev/null || echo false)"
          echo "get-task-allow: $GTA"

          # 断言：模式与产物一致
          if [ "$BUILD_TARGET" = "app-store" ] && [ "$GTA" != "false" ]; then
            echo "::error::app-store IPA has get-task-allow=$GTA (expected false)."
            exit 1
          fi
          if [ "$BUILD_TARGET" = "development" ] && [ "$GTA" != "true" ]; then
            echo "::error::development IPA has get-task-allow=$GTA (expected true)."
            exit 1
          fi

          # 断言：IPA 内 SDK 版本 ≥ 27.1，build number 正确
          IPA_SDK="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP_PATH/Info.plist" 2>/dev/null || true)"
          IPA_SDK_VER="${IPA_SDK#iphoneos}"
          echo "IPA DTSDKName: $IPA_SDK"
          if ! awk -v v="$IPA_SDK_VER" 'BEGIN { if (v !~ /^[0-9]+(\.[0-9]+)*$/) exit 1; split(v, a, "."); m = a[1] + 0; n = (a[2] == "" ? 0 : a[2] + 0); if (m < 27) exit 1; if (m == 27 && n < 1) exit 1; exit 0 }'; then
            echo "::error::IPA was not built against iOS 27.1+ SDK ($IPA_SDK)."
            exit 1
          fi
          IPA_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist" 2>/dev/null || true)"
          echo "IPA CFBundleVersion: $IPA_BUILD (expected $BUILD_NUMBER)"
          if [ "$BUILD_TARGET" = "app-store" ] && [ "$IPA_BUILD" != "$BUILD_NUMBER" ]; then
            echo "::error::IPA CFBundleVersion ($IPA_BUILD) != $BUILD_NUMBER."
            exit 1
          fi

          # 检查小组件扩展签名（若存在）；app-store 模式必须存在
          WIDGET_APPEX="$(find "$APP_PATH/PlugIns" -maxdepth 1 -name '*.appex' 2>/dev/null | head -n 1 || true)"
          if [ -n "$WIDGET_APPEX" ] && [ -d "$WIDGET_APPEX" ]; then
            echo "===== Widget Extension Code Signature Info ====="
            codesign -dv --verbose=4 "$WIDGET_APPEX" 2>&1 | tee build/widget-codesign-info.log
            codesign --verify --verbose=2 "$WIDGET_APPEX"
            if [ -f "$WIDGET_APPEX/embedded.mobileprovision" ]; then
              security cms -D -i "$WIDGET_APPEX/embedded.mobileprovision" > "$VERIFY_DIR/widget-profile.plist"
              echo "Widget Profile Name: $(/usr/libexec/PlistBuddy -c "Print :Name" "$VERIFY_DIR/widget-profile.plist" 2>/dev/null || true)"
            fi
          elif [ "$BUILD_TARGET" = "app-store" ]; then
            echo "::error::app-store IPA contains no widget extension."
            exit 1
          fi

      # --------------------------------------------------
      # 9. 生成 SHA256 校验码
      # --------------------------------------------------
      - name: Generate SHA256 Checksums
        run: |
          set -euo pipefail
          cd dist-ios
          shasum -a 256 ./*.ipa > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --------------------------------------------------
      # 10. 上传 IPA 构建产物至 GitHub Artifacts
      #     放在 TestFlight 上传之前：即使上传失败，签好名的 IPA 也能下载。
      # --------------------------------------------------
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiandiLuopan-${{ github.event.inputs.build_target || 'development' }}-IPA
          path: tiandi_luopan/dist-ios/
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 11. 上传至 App Store Connect / TestFlight (仅 app-store 模式生效)
      #     改为 xcodebuild -exportArchive + destination=upload + API Key 认证：
      #     不再使用 altool（--upload-app 已被标记 deprecated，--apple-id 也不属于该子命令），
      #     失败时由 xcodebuild 的退出码直接报错，不再 grep 日志猜成败。
      # --------------------------------------------------
      - name: Upload to App Store Connect (TestFlight)
        # push 触发时 BUILD_TARGET 恒为 development，所以 push 永远不会上传；
        # 上传只在手动选 app-store 且勾选 upload_to_appstore 时发生。
        if: ${{ env.BUILD_TARGET == 'app-store' && inputs.upload_to_appstore }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          API_KEY_RAW: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "===== Checking App Store Connect Upload Credentials ====="
          if [ -z "$API_KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY_RAW" ]; then
            echo "::error::Missing one of the required secrets: APPSTORE_API_KEY_ID, APPSTORE_ISSUER_ID, or APPSTORE_API_PRIVATE_KEY."
            echo "Please configure these in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          trap 'rm -f "$KEY_FILE"' EXIT

          # 兼容：Secret 存的是 PEM 原文或 Base64 均可
          if printf '%s' "$API_KEY_RAW" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$API_KEY_RAW" > "$KEY_FILE"
          else
            printf '%s' "$API_KEY_RAW" | base64 -D > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"

          echo "Uploading build $BUILD_NUMBER to App Store Connect using API Key: $API_KEY_ID..."
          mkdir -p build/upload-export
          xcodebuild -exportArchive \
            -archivePath build/TiandiLuopan.xcarchive \
            -exportPath build/upload-export \
            -exportOptionsPlist ExportOptions-upload.plist \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee build/xcodebuild-upload.log

          echo "🎉 Successfully uploaded to App Store Connect! TestFlight build will appear in 5-15 minutes."

      # --------------------------------------------------
      # 12. 上传构建与诊断日志
      # --------------------------------------------------
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TiandiLuopan-Build-Logs-${{ github.event.inputs.build_target || 'development' }}
          path: |
            tiandi_luopan/build/*.log
            tiandi_luopan/ExportOptions.plist
            tiandi_luopan/ExportOptions-upload.plist
          if-no-files-found: ignore
          retention-days: 7

      # --------------------------------------------------
      # 13. 清理签名材料（无论成败）
      #     只删本次安装的描述文件，不动 runner 上其他任务的文件。
      # --------------------------------------------------
      - name: Cleanup Signing Material
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set +e

          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null
          fi

          LIST="$RUNNER_TEMP/signing/installed_profiles.txt"
          if [ -f "$LIST" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && rm -f "$f"
            done < "$LIST"
          fi

          rm -rf "$RUNNER_TEMP/signing" "$RUNNER_TEMP/appstoreconnect" "$RUNNER_TEMP/ipa-verify"
          exit 0