plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.yiijingcompass'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.yiijingcompass"
        minSdk 26
        targetSdk 34
        versionCode 120
        versionName "1.2.0"
    }

    signingConfigs {
        release {
            storeFile file('../yanxiang.jks')
            storePassword 'yanxiang123'
            keyAlias 'yanxiang'
            keyPassword 'yanxiang123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'release') {
                outputFileName = "yanxiang-v${variant.versionName}.apk"
            } else {
                outputFileName = "yanxiang-v${variant.versionName}-${variant.buildType.name}.apk"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
