name: iOS Functional Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'tiandi_luopan/ios/**'
      - '.github/workflows/ios-regression-tests.yml'
permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.repository }}
  cancel-in-progress: false

jobs:
  functional-tests:
    runs-on: xcode-27
    # 30min tests + 9m45s artifact retries + checkout/summary margin.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run tests on an available iPhone simulator
        id: regression_tests
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/ios-regression-devices.json"
          TEST_DEVICE_ID="$(python3 - "$RUNNER_TEMP/ios-regression-devices.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as stream:
              devices = json.load(stream)['devices']
          candidates = [device for runtime, rows in devices.items() if '.iOS-' in runtime
                        for device in rows if device.get('isAvailable') and 'iPhone' in device['name']]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          print(next((device for device in candidates if device['state'] == 'Booted'), candidates[0])['udid'])
          PY
          )"
          mkdir -p build
          xcodebuild test \
            -project tiandi_luopan/ios/TiandiLuopan.xcodeproj \
            -scheme TiandiLuopan \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$TEST_DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath build/ios-regression.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ios-regression.log
      # xcresult/logs are diagnostics. An ArtifactService outage must not turn
      # passing tests into a failed test job, or hide the original test failure.
      # Retry the entire action: its internal CreateArtifact retries can exhaust
      # before GitHub's service recovers. overwrite also handles partial uploads.
      - name: Upload test results (attempt 1)
        id: upload_results_1
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ios-functional-regression-results
          path: |
            build/ios-regression.xcresult
            build/ios-regression.log
          if-no-files-found: ignore
          overwrite: true

      - name: Wait before retrying test result upload
        if: ${{ !cancelled() && steps.upload_results_1.outcome == 'failure' }}
        shell: bash
        run: sleep 15

      - name: Upload test results (attempt 2)
        id: upload_results_2
        if: ${{ !cancelled() && steps.upload_results_1.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ios-functional-regression-results
          path: |
            build/ios-regression.xcresult
            build/ios-regression.log
          if-no-files-found: ignore
          overwrite: true

      - name: Wait before final test result upload
        if: ${{ !cancelled() && steps.upload_results_2.outcome == 'failure' }}
        shell: bash
        run: sleep 30

      - name: Upload test results (attempt 3)
        id: upload_results_3
        if: ${{ !cancelled() && steps.upload_results_2.outcome == 'failure' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: ios-functional-regression-results
          path: |
            build/ios-regression.xcresult
            build/ios-regression.log
          if-no-files-found: ignore
          overwrite: true

      - name: Report unavailable test result artifact
        if: ${{ !cancelled() && steps.upload_results_3.outcome == 'failure' }}
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.regression_tests.outcome }}
        run: |
          echo "::warning::Test result upload failed after three attempts. Inspect the test step output for the actual test result. If timeouts persist, check runner connectivity to GitHub's artifact service."
          {
            echo '### Test result artifact unavailable'
            echo
            printf 'Test step outcome: **%s**.\n\n' "$TEST_OUTCOME"
            echo 'The artifact upload failed after three attempts. The test output is still available in the simulator test step logs.'
            echo
            echo 'For persistent CreateArtifact timeouts, check runner DNS, proxy and HTTPS access to the GitHub artifact endpoints.'
          } >> "$GITHUB_STEP_SUMMARY"
